# Makes deployment deterministic: connecting the repository is enough, with no
# settings to fill in by hand.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned so the deploy matches local. Astro 5 needs 18.20.8+, 20.3+ or 22+.
  NODE_VERSION = "22"

# Security headers live in dist/_headers, generated at build time by
# scripts/build-csp.mjs. Defining headers here as well would override that file.

# FF&E and OS&E collections were retired in favour of the monthly edits.
[[redirects]]
  from = "/our-curations/ffe/*"
  to = "/our-curations"
  status = 301

[[redirects]]
  from = "/our-curations/ffe"
  to = "/our-curations"
  status = 301

[[redirects]]
  from = "/our-curations/ose/*"
  to = "/our-curations"
  status = 301

[[redirects]]
  from = "/our-curations/ose"
  to = "/our-curations"
  status = 301
